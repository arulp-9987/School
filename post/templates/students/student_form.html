<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <h2>Student Form</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn btn-success">
            Save
        </button>

        <a href="{% url 'student_list' %}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
